[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "page-change-watch"
version = "1.0.0"
description = "Watch web pages for meaningful content changes: noise-filtered snapshots, readable diffs, cron-friendly exit codes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia" }]
keywords = ["monitoring", "diff", "web", "change-detection", "robots.txt", "cron"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]
render = ["playwright>=1.40"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dreadmoreeee/page-change-watch"

[project.scripts]
page-change-watch = "page_change_watch.cli:main"

[tool.setuptools]
packages = ["page_change_watch"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
